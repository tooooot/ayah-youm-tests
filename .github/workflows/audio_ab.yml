name: audio-ab
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python tools/build_audio_v3.py
      - uses: actions/upload-artifact@v4
        with: { name: audio-ab, path: out/, retention-days: 3 }
