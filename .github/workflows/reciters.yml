name: reciters
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: ffmpeg -version | head -1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python tools/reciter_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reciters, path: out/ }
