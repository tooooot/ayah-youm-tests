<script>
try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => {}); } catch (_) {}
const TOKEN = location.pathname.split('/')[2];
const V2 = true;   // TOKEN = رقم ملف الولد والجلسة من الحساب (لا روابط رموز قديمة)
const stateApi = () => 'v2/kids/' + TOKEN + '/state';
let RATE = 1;   // تُضبط من حالة الولد بعد التحميل
const resultApi = () => 'v2/kids/' + TOKEN + '/result';
const app = $('#app');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let S = null;            // حالة الولد من الخادم
let audio = null;

let DOCK = null, ZOOM = null, RO = null, PLAN = {}, CENTER = null;
function clearDock() { if (DOCK) { DOCK.remove(); DOCK = null; } if (ZOOM) { ZOOM.remove(); ZOOM = null; } document.body.classList.remove('tm', 'tl'); if (RO) { RO.disconnect(); RO = null; } app.style.paddingBottom = ''; app.style.paddingTop = ''; app.classList.remove('win'); app.style.top = app.style.bottom = ''; CENTER = null; }
let PEND = null;
const show = (...nodes) => {
  LOOP++; stopAudio(); clearDock(); app.replaceChildren(...nodes); window.scrollTo(0, 0);
  document.body.classList.toggle('paper', !!PEND);   // شاشة الدرس: ورق المصحف البيج
  if (PEND) {   // الشريط الذي جُهّز لهذه الشاشة
    ({ dock: DOCK, zoom: ZOOM } = PEND); PEND = null;
    document.body.append(ZOOM, DOCK);
    app.classList.add('win');   // نافذة ثابتة بين بطاقة النص والشريط: لا تمرير أبداً، والآية في وسطها
    RO = new ResizeObserver(() => { app.style.top = ZOOM.offsetHeight + 'px'; app.style.bottom = DOCK.offsetHeight + 'px'; CENTER && CENTER(); });
    RO.observe(ZOOM); RO.observe(DOCK);
    RO.observe(DOCK);
  }
};
// شريط تحكّم ثابت أسفل الشاشة + لوحة «النص الكبير» تُفتح فوقه؛ الصفحة تبقى مرئية فوقهما. يُستدعى قبل show()
function setDock(zoomNodes, ...nodes) {
  const dock = el('div', { class: 'dock' }, el('div', { class: 'dock-in' }, nodes));
  const zoom = el('div', { class: 'zoombox' }, zoomNodes);
  PEND = { dock, zoom };
}
// كاميرا الصفحة: تعرض الآية كاملة في وسط النافذة (نظرة عامة)، أو تقترب من كلمة وتتبعها بانسياب (تحويل translate+scale يُعاد رسمه كل إطار فيبقى الخط حاداً)
function centerAyah(c) {
  const pe = c.el; let g = null, cur = null, tgt = null, raf = 0, last = 0, mode = 'over', fi = -1;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function measure() {
    const ar = app.getBoundingClientRect(); if (!ar.height || !c.words.length) return false;
    pe.style.transformOrigin = '0 0'; pe.style.transform = 'none';
    const p = pe.getBoundingClientRect(), r = c.words.map(w => { const b = w.getBoundingClientRect(); return { x: b.left - p.left + b.width / 2, y: b.top - p.top + b.height / 2, w: b.width, t: b.top - p.top, b: b.bottom - p.top }; });
    const mw = r.reduce((x, y) => x + y.w, 0) / r.length;
    g = { W: ar.width, H: ar.height, pl: p.left - ar.left, pt: p.top - ar.top, pw: p.width, ph: p.height, r, s: clamp(ar.width * .8 / (3 * mw), 1.4, 3.4) };
    return true;
  }
  function overview() {   // الآية في الوسط؛ الأطول من النافذة تُحاذى من أعلاها
    const top = Math.min(...g.r.map(x => x.t)), bot = Math.max(...g.r.map(x => x.b));
    let y = bot - top >= g.H - 24 ? top - 12 : top - (g.H - (bot - top)) / 2;
    y = clamp(y, -8, g.ph + 16 - g.H); if (g.ph + 16 <= g.H) y = -8;
    return { tx: 0, ty: -y, s: 1 };
  }
  function focusAt(i) {
    const s = g.s, q = g.r[i], sw = g.pw * s, sh = g.ph * s;
    let tx = g.W / 2 - g.pl - q.x * s, ty = g.H / 2 - g.pt - q.y * s;
    tx = sw > g.W ? clamp(tx, g.W - g.pl - sw, -g.pl) : (g.W - sw) / 2 - g.pl;
    ty = sh > g.H ? clamp(ty, g.H - g.pt - sh, -g.pt) : (g.H - sh) / 2 - g.pt;
    return { tx, ty, s };
  }
  const apply = () => { pe.style.transform = `translate(${cur.tx}px,${cur.ty}px) scale(${cur.s})`; };
  const retarget = () => { if (g) tgt = mode === 'over' || fi < 0 ? overview() : focusAt(fi); };
  function tick(t) {
    raf = 0; if (!cur || !tgt) return;
    pe.style.willChange = 'transform';   // أثناء الحركة طبقة مركّبة بالمعالج الرسومي؛ وعند السكون يُعاد رسم الخط حاداً
    const dist = Math.abs(tgt.tx - cur.tx) + Math.abs(tgt.ty - cur.ty), k = 1 - Math.exp(-Math.max(0, Math.min(.1, (t - last) / 1000)) * (6.5 + Math.min(14, dist / 60))); last = t;   // القفزة البعيدة (سطر جديد/مقطع جديد) أسرع
    for (const key of ['tx', 'ty', 's']) cur[key] += (tgt[key] - cur[key]) * k;
    apply();
    if (Math.abs(tgt.tx - cur.tx) + Math.abs(tgt.ty - cur.ty) + Math.abs(tgt.s - cur.s) * 100 > .3) raf = requestAnimationFrame(tick); else { Object.assign(cur, tgt); apply(); pe.style.willChange = 'auto'; }
  }
  const go = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } };
  function snap() { if (!measure()) return; retarget(); cur = { ...tgt }; apply(); }
  const api = {
    focus(i) { if (!g || i < 0 || i >= g.r.length || (mode === 'focus' && fi === i)) return; mode = 'focus'; fi = i; retarget(); go(); },
    overview() { mode = 'over'; fi = -1; retarget(); go(); },
    get zoomed() { return mode === 'focus'; },
  };
  CENTER = snap; snap();
  c.cam = api; return api;
}
function stopAudio() { if (audio) { audio.onended = null; audio.pause(); audio = null; } }
const audioOf = key => new Audio('/audio/' + key + '.mp3');

async function load() {
  try { await Mushaf.init(); PLAN = await fetch('/data/plan.json?v=20261101ab').then(r => r.json()).catch(() => ({})); S = await api(stateApi()); RATE = Math.max(.8, Math.min(1.5, +S.speed || 1)); if (V2) return startV2(); home(); }
  catch (e) { if (V2) return void (location.href = '/app'); show(el('div', { class: 'card' }, el('h2', {}, 'الرابط غير صحيح'), el('p', { class: 'mute' }, 'اطلب من أبيك الرابط الخاص بك.'))); }
}
// الوضع الجديد: التطبيق يفتح الدرس مباشرة بحسب kind وkey في الرابط
function startV2() {
  const q = new URLSearchParams(location.search), kind = q.get('kind') || 'new', key = q.get('key');
  const u = kind === 'review' ? (S.reviews || []).find(x => x.key === key) : kind === 'practice' ? S.todayUnit : S.next;
  if (!u) return void (location.href = '/app');
  // شاشة «جاهز؟»: ضغطة المستخدم على هذه الصفحة تُجيز تشغيل الصوت (المتصفحات تمنع الصوت التلقائي بعد الانتقال بين الصفحات وفي التصفح الخفي)
  const noSr = kind === 'new' && !SR && !window.NATIVE;
  const label = kind === 'review' ? 'مراجعة' : kind === 'practice' ? 'تدريب' : 'آية جديدة';
  show(el('div', { class: 'card', style: 'text-align:center;margin-top:12vh' },
    el('div', { class: 'mute' }, label), el('h1', {}, `سورة ${u.name} — الآية ${u.i}`),
    el('p', { class: 'mute' }, 'سنشغّل الصوت الآن: ارفع صوت الجوال وتأكد أنه ليس صامتاً.'),
    noSr ? el('p', { class: 'note' }, 'هذا المتصفح لا يسمع التسميع بالصوت (مثل Firefox وبعض متصفحات آيفون). افتح ثبات من Chrome على أندرويد أو الكمبيوتر أو من تطبيق ثبات؛ وإن أكملتَ هنا فسيحتاج تسميعك إلى أن يسمعك أبوك ويؤكد.') : '',
    el('button', { class: 'btn gold', onclick: () => lesson(u, kind, q.get('extra') === '1') }, 'ابدأ الدرس'),
    el('button', { class: 'btn ghost', onclick: home }, 'رجوع')));
}


function home() { location.href = '/app'; }

// ───── الدرس ─────
// ١ اعرف مكانها في صفحة المصحف ← ٢ حلقة استماع وترديد متواصلة (يخفى النص تدريجياً في الصفحة نفسها) ← ٣ تسميع بالصوت
const MINSAY = window.__fast ? (window.__live ? 1500 : 20) : 1200;   // أقل مدة صمت للترديد بين تلاوتين (ملي ثانية)
let LOOP = 0;                                // يُبطل حلقة التكرار عند الخروج من الشاشة

function lesson(u, kind, extra) {
  const full = kind !== 'review';   // new وpractice: استماع وترديد ثم تسميع؛ review: تسميع فقط
  const L = { fails: 0 }, T0 = Date.now();
  const words = u.t.split(' ');
  const run = () => (full ? stepLoop : stepRecite)();

  // بطاقة النص الكبير في أعلى الشاشة (العنوان يميناً، النص في الوسط) — الإخفاء يُطبَّق على الصفحة أيضاً
  function strip() {
    const spans = words.map(w => el('span', { class: 'w' }, w));
    spans.forEach(s => s.addEventListener('click', () => s.classList.remove('hid')));
    const fs = words.length <= 6 ? 2.6 : words.length <= 12 ? 2.2 : words.length <= 20 ? 1.85 : 1.55;
    const box = el('div', { class: 'quran big', style: `font-size:${fs}rem` }, spans);
    return { box,
      setHidden: fn => spans.forEach((s, i) => s.classList.toggle('hid', !!fn(i, spans.length))),
      setDim: fn => spans.forEach((s, i) => s.classList.toggle('dim', !!fn(i))),
      setHit: fn => spans.forEach((s, i) => s.classList.toggle('hit', !!fn(i))),
      setCur: fn => spans.forEach((s, i) => s.classList.toggle('cur', !!fn(i))) };
  }
  const topCard = (box, extra) => [el('button', { class: 'backbtn', onclick: home, 'aria-label': 'رجوع' }, '✕'), extra || '',
    el('div', { class: 'ttl' }, `سورة ${u.name} — ${AR_DIGITS(u.i)}`), box];
  // صفحة المصحف بخطها الأصلي: الآية ملوّنة والباقي ضبابي؛ تُمرَّر الشاشة تلقائياً إلى الآية
  function page() {
    const host = el('div'), box = { c: null };
    Mushaf.render(host, u.key).then(c => { box.c = c; if (box.onReady) box.onReady(c); centerAyah(c); }).catch(() => {});
    return { host, box };
  }
  const playBtn = (label = '🔊 استمع') => el('button', { class: 'btn ghost', onclick: () => { stopAudio(); audio = audioOf(u.key); audio.play().catch(() => {}); } }, label);

  // خطة الحلقة: ١٠ استماعات متتالية تلقائياً ثم ١٠ ترديدات (القارئ يقرأ والطفل يردّد) ثم التسميع.
  // الآية الطويلة (>12 كلمة): مقطعاً مقطعاً ثم كاملة. سقف الزمن ≈ 5 دقائق (التقليل حتى 5)
  function makePlan() {
    const info = PLAN[u.key] || {};
    const lvOf = (r, n) => r < Math.ceil(n * .25) ? 0 : r < Math.ceil(n * .5) ? 1 : r < Math.ceil(n * .75) ? 2 : 3;
    const N = Math.max(3, Math.min(10, +S.repeats || 10));   // لكل مقطع صوتي: N استماعات متتالية تلقائياً ثم N ترديدات (القارئ يقرأ ثم الطفل)؛ الافتراضي 10، ويضبطه الأب
    const rounds = (w, fs, fe, tag, g, slowFirst) => [
      ...Array.from({ length: N }, (_, i) => ({ slow: slowFirst && i === 0, listen: true, w, fs, fe, g, lv: 0, tag, n: i + 1, of: N })),
      ...Array.from({ length: N }, (_, i) => ({ slow: false, w, fs, fe, g, lv: lvOf(i, N), tag, n: i + 1, of: N }))];
    if (info.ch) {   // الآية الطويلة: التكرار على كل مقطع (حدوده علامات الوقف) لا على الآية كاملة، ثم ربط بالآية كاملة ثلاث مرات
      const out = []; info.ch.forEach(([w0, w1, fs, fe], c) => out.push(...rounds([w0, w1], fs, fe, `الجزء ${c + 1}/${info.ch.length}`, c, false)));
      const g = info.ch.length;
      const J = Math.min(3, N);
      out.push(...Array.from({ length: J }, (_, i) => ({ slow: false, listen: true, w: null, g, lv: 0, tag: 'كاملة', n: i + 1, of: J })), ...Array.from({ length: J }, (_, i) => ({ slow: false, w: null, g, lv: Math.min(3, i + 1), tag: 'كاملة', n: i + 1, of: J })));
      return out;
    }
    return rounds(null, undefined, undefined, '', 0, true);
  }

  function stepLoop() {
    const plan = makePlan();
    const st = strip(), pg = page();
    // لا إخفاء للكلمات: الآية كاملة دائماً، وغير المقطع الحالي يخفت فقط؛ والكلمة المقروءة تتلوّن
    const mark = i => { const c = pg.box.c; if (!c) return; c.setCur(j => j === i); if (i >= 0 && c.cam) c.cam.focus(i); };   // الكاميرا والتلوين على الكلمة الجارية في الصفحة نفسها
    const apply = e => {
      const w = e && e.w, dim = w ? (i => i < w[0] || i >= w[1]) : (() => false);
      if (pg.box.c) pg.box.c.setDim(dim);
    };
    pg.box.onReady = c => { c.el.classList.add('dimrest'); apply(plan[Math.min(r, plan.length - 1)]); };
    const hit = fn => pg.box.c && pg.box.c.setHit(fn);
    const info = PLAN[u.key] || {};
    const wt = words.map(w => (w.replace(/[^ء-ي]/g, '').length || 1) + .5);
    // تلوين الكلمة الجارية: من توقيت الكلمات الدقيق (Quran Foundation) ومتزامناً مع زمن التشغيل الفعلي للصوت؛
    // وإن لم يتوفر التوقيت فبالنسبة لطول الكلمة. slow=true: ملف الحصري (يكرّر المعلّم بعض الكلمات، فقد يعود التلوين للوراء وهذا صحيح)
    let FID = 0;
    function follow(e, slow, ms, id, a) {
      const my = ++FID;
      const segs = slow ? info.ss : info.fs, [w0, w1] = e.w || [0, words.length];
      const T0 = slow || !e.w ? 0 : e.fs, T1 = slow ? info.ds : e.w ? e.fe : info.df, t0 = performance.now();
      const tot = wt.slice(w0, w1).reduce((x, y) => x + y, 0);
      const tick = () => {
        if (id !== LOOP || my !== FID) return;
        const f = (performance.now() - t0) / ms;
        if (f >= 1) { mark(-1); return; }
        let cur = -1;
        if (segs && segs.length) {
          const t = a && a.currentTime > 0 ? a.currentTime : T0 + f * (T1 - T0);
          for (const s of segs) { if (s[1] <= t + .02) cur = s[0]; else break; }
          if (e.w && (cur < w0 || cur >= w1)) cur = cur < w0 ? w0 : w1 - 1;
        } else {
          let acc = 0; cur = w1 - 1;
          for (let i = w0; i < w1; i++) { acc += wt[i] / tot; if (f < acc) { cur = i; break; } }
        }
        mark(cur); requestAnimationFrame(tick);
      };
      tick();
    }
    const banner = el('div', { class: 'turn' }, '');
    // نقاط التقدّم للمجموعة الحالية فقط (جزء أو كاملة): لا عشرات النقاط الصغيرة
    const dots = el('div', { class: 'dots2' }), gStart = {}; plan.forEach((e, i) => { if (gStart[e.g] === undefined) gStart[e.g] = i; });
    let curG = -1;
    const setDots = k => {
      const g = k >= plan.length ? plan[plan.length - 1].g : plan[k].g;
      if (g !== curG) { curG = g; dots.replaceChildren(...plan.filter(e => e.g === g).map(() => el('i'))); }
      const idx = k >= plan.length ? 1e9 : k - gStart[g];
      Array.from(dots.children).forEach((d, j) => { d.className = j < idx ? 'on' : j === idx ? 'cur' : ''; });
    };
    const main = el('button', { class: 'btn', disabled: true, onclick: () => main.onact && main.onact() }, '…');
    const pause = el('button', { class: 'ibtn', 'aria-label': 'إيقاف مؤقت', onclick: toggle }, '⏸');
    let r = 0, playing = false, skip = null, live = null;
    const slowUrl = `/audio/${u.key}.mp3`, fastUrl = `/audio-ab/${u.key}.mp3`;
    const sleep = ms => new Promise(res => setTimeout(res, ms));
    const dOf = e => (e.w ? e.fe - e.fs : (e.slow ? info.ds : info.df)) || 4;
    function playOnce(e, id) {   // يرجع مدة ما سُمع بالثواني
      return new Promise(res => {
        const go1 = (slow, fallback) => {
          const a0 = e.fs, a1 = e.fe, seg = !!e.w && !slow;
          const a = audio = new Audio(slow ? slowUrl : fastUrl); let timer = null, started = false;
          const fail = () => { clearTimeout(timer); if (fallback) go1(true, false); else res(4); };
          const rate = slow ? 1 : RATE;   // سرعة القارئ السريع (يضبطها الأب)؛ البطيء بسرعته
          try { a.playbackRate = rate; a.preservesPitch = true; a.webkitPreservesPitch = true; } catch (_) {}
          const end = () => { clearTimeout(timer); a.onended = null; res(window.__fast ? 0.03 : (seg ? a1 - a0 : dur(a)) / rate); };
          const dur = x => (x.duration > 0 && isFinite(x.duration) ? x.duration : 4);
          const start = () => {
            if (started) return; started = true;
            if (seg && a0 > 0) { try { a.currentTime = a0; } catch (_) {} }
            a.play().then(() => {
              follow(e, slow, dOf({ ...e, slow }) * 1000 / rate, id, a);
              if (seg) timer = setTimeout(() => { a.pause(); end(); }, (a1 - (a0 > 0 ? a0 : 0)) * 1000 / rate);
            }).catch(err => {
              if (err && err.name === 'NotAllowedError') {   // المتصفح منع الصوت التلقائي: نطلب ضغطة بدل الصمت
                setTurn(false, '🔇 اضغط على الشاشة لتشغيل الصوت');
                const retry = () => { document.removeEventListener('pointerdown', retry, true); if (id !== LOOP) return; started = false; start(); };
                document.addEventListener('pointerdown', retry, true);
              } else fail();
            });
          };
          a.onended = end; a.onerror = fail;
          if (seg && a0 > 0 && !(a.readyState >= 1)) { a.onloadedmetadata = start; setTimeout(start, 1500); } else start();
        };
        go1(e.slow, !e.slow && !e.w);
      });
    }
    // طلب إذن الميكروفون مرة واحدة قبل البدء (حتى لا تظهر نافذة الإذن وسط الدور)؛ يبقى الإذن للتعرّف على الكلام
    async function askMic() {
      if (!SR || window.__fast || window.NATIVE || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;   // داخل التطبيق: إضافة التعرّف الأصلية تطلب الإذن بنفسها
      try { (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach(t => t.stop()); } catch (_) {}
    }
    const tone = (hz, ms = 140, delay = 0) => {
      if (window.__fast) return;
      try {
        const ac = tone.ac = tone.ac || new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
        o.frequency.value = hz; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + ms / 1000);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + ms / 1000);
      } catch (_) {}
    };
    const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} };
    const cue = () => { tone(880, 120); vib(70); };                                       // بداية دوره
    const okCue = () => { tone(660, 110); tone(880, 160, .12); vib([40, 40, 40]); };        // أتمّ دوره
    // تغذية راجعة حيّة في دوره: كل كلمة ينطقها (وفق التعرّف على الكلام) تخضرّ فوراً؛ لا تمنعه من المتابعة
    const cl = u.c.split(' '), gi = []; { let wi = 0; cl.forEach(t => { gi.push(Math.min(wi, words.length - 1)); if (t !== 'يا') wi++; }); }
    function liveStart(e) {
      if (!SR || (window.__fast && !window.__live)) return null;
      const [w0, w1] = e.w || [0, words.length], idx = cl.map((_, j) => j).filter(j => gi[j] >= w0 && gi[j] < w1), exp = idx.map(j => cl[j]).join(' ');
      let on = true, prev = '', heard = '', rec = null, frac = 0;
      const upd = () => {
        const h = compare(exp, (prev + ' ' + heard).trim()).hit, wh = {};
        idx.forEach((j, k) => { wh[gi[j]] = wh[gi[j]] !== false && h[k]; });
        hit(i => wh[i] === true); let fr = -1; idx.forEach(j => { if (wh[gi[j]]) fr = Math.max(fr, gi[j]); });
        pg.box.c && pg.box.c.cam && pg.box.c.cam.focus(Math.min(Math.max(fr + 1, w0), w1 - 1)); frac = idx.length ? h.filter(Boolean).length / idx.length : 0;
      };
      const mk = () => {
        rec = new SR(); rec.lang = 'ar-SA'; rec.continuous = true; rec.interimResults = true;
        rec.onresult = ev => { heard = joinResults(ev.results); upd(); };
        rec.onend = () => { if (on) { prev = (prev + ' ' + heard).trim(); heard = ''; mk(); } };
        rec.onerror = () => {};
        try { rec.start(); } catch (_) {}
      };
      mk();
      return { frac: () => frac, stop() { on = false; try { rec.stop(); } catch (_) {} } };
    }
    function setTurn(mine, text) {
      banner.textContent = text; banner.className = 'turn ' + (mine ? 'mine' : 'listen');
      ZOOM && ZOOM.classList.toggle('mine', mine);
      document.body.classList.toggle('tm', mine); document.body.classList.toggle('tl', !mine);
    }
    // دور الطالب: بمقدار طول الآية؛ زر «انتهيت» يتخطّى الانتظار
    async function myTurn(ms, id, e) {
      setTurn(true, '🎙 دورك — اقرأ الآن'); cue();
      main.disabled = false; main.textContent = '✓ انتهيت'; main.onact = () => skip && skip();
      pg.box.c && pg.box.c.cam && pg.box.c.cam.focus(e.w ? e.w[0] : 0);
      live = liveStart(e);
      if (!live) follow(e, false, ms, id, null);   // بلا تعرّف: يتلوّن النص بإيقاع القراءة ليسير معه
      await new Promise(res => { skip = res; setTimeout(res, ms); });
      const ok = !live || live.frac() >= .5;
      live && live.stop(); live = null; skip = null; main.disabled = true; main.textContent = '…'; main.onact = null;
      return ok;
    }
    async function loop(id) {
      while (r < plan.length && id === LOOP) {
        const e = plan[r];
        apply(e); if (pg.box.c) pg.box.c.el.dataset.hl = e.lv; hit(() => false); setDots(r);
        setTurn(false, (e.listen ? '🔊 استمع للقارئ' : '🔊 اسمع القارئ ثم اقرأ') + (/^(الجزء|كاملة)/.test(e.tag) ? ' — ' + e.tag : ''));
        const d = await playOnce(e, id);
        if (id !== LOOP) return;
        FID++; mark(-1);
        if (e.listen) await sleep(window.__fast ? 5 : 400);
        else {
          const ok = await myTurn(Math.max(MINSAY, d * 1000), id, e);
          if (id !== LOOP) return;
          if (ok) { okCue(); await sleep(window.__fast ? 5 : 600); }
          if (id !== LOOP) return;
        }
        r++;
      }
      if (id !== LOOP) return;
      playing = false; apply(null); mark(-1); hit(() => false); pg.box.c && pg.box.c.cam && pg.box.c.cam.overview(); r = 0; setDots(plan.length);
      setTurn(false, '🌟 ما شاء الله — الآن التسميع'); okCue();
      pause.style.display = 'none'; main.disabled = false; main.textContent = 'جاهز للتسميع'; main.onact = () => stepRecite();
    }
    function toggle() {
      if (playing) { LOOP++; stopAudio(); skip && skip(); live && live.stop(); live = null; playing = false; mark(-1); pause.textContent = '▶'; return; }
      playing = true; pause.textContent = '⏸'; loop(++LOOP);
    }
    setDock(topCard('', pause), banner, dots, main);
    PEND.zoom.classList.add('slim');
    show(pg.host);
    askMic().then(() => setTimeout(toggle, 300));   // يبدأ تلقائياً
  }

  function stepRecite() {
    const st = strip(), pg = page();
    let peeking = false;
    // لا بطاقة علوية: الصفحة نفسها هي الشاشة؛ كلمات الآية مخفية فيها (اللمس يكشف كلمة) وتُلوَّن النتيجة عليها
    const hideAll = () => { const c = pg.box.c; if (c) { c.setHidden(() => true); c.setHit && c.setHit(() => false); c.setMiss && c.setMiss(() => false); } };
    pg.box.onReady = hideAll;
    const msg = el('div', { class: 'say' }, '');
    const actions = el('div');
    let rec = null, heardAlts = [];
    // تسجيل صوت الولد أثناء التسميع (V2 فقط): يُحفظ على جهازه 14 يوماً، وتُرسل نسخة مؤقتة للأب إن بقي التسميع معلّقاً
    const canRec = V2 && kind !== 'practice' && S.recordVoice !== false && Rec.supported();
    let recorder = null, lastBlob = null, recErr = '', noConc = !!window.NATIVE;   // التسجيل المتزامن مع التعرّف يُعطَّل تلقائياً إن تعارض الميكروفون (وفي التطبيق المثبّت دائماً)
    const startRec = async () => { if (!canRec) return; lastBlob = null; recorder = Rec.recorder(); try { await recorder.start(); recErr = ''; } catch (e) { recorder = null; recErr = e && e.name || 'err'; } };
    const stopRec = async () => { if (!recorder) return; try { lastBlob = await recorder.stop(); } catch (_) {} recorder = null; };

    const mic = el('button', { class: 'mic', 'aria-label': 'ميكروفون', onclick: toggle }, '🎙');
    async function toggle() {
      if (!SR) return toggleRecordOnly();
      if (rec) { rec.stop(); return; }
      stopAudio(); heardAlts = []; hideAll(); actions.replaceChildren();
      if (!noConc) await startRec();
      rec = new SR(); rec.lang = 'ar-SA'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 3;
      rec.onresult = ev => {
        heardAlts = [];
        for (let k = 0; k < 3; k++) heardAlts.push(joinResults(ev.results, k));
        msg.textContent = '… ' + heardAlts[0];
      };
      rec.onerror = ev => {
        L.srErr = ev.error || 'unknown';
        if (recorder && ['audio-capture', 'not-allowed', 'aborted', 'service-not-allowed'].includes(ev.error)) { noConc = true; stopRec(); }
        const why = { 'not-allowed': 'اسمح للمتصفح باستخدام الميكروفون ثم أعد المحاولة.', 'service-not-allowed': 'خدمة التعرّف على الكلام غير مفعّلة في جهازك (فعّل الإملاء الصوتي في إعدادات الجوال).', 'no-speech': 'لم أسمع صوتاً. قرّب الجوال وأعد المحاولة.', 'audio-capture': 'لا أجد ميكروفوناً في هذا الجهاز.', 'network': 'يلزم اتصال بالإنترنت للتعرّف على الصوت.', 'language-not-supported': 'جهازك لا يدعم التعرّف على العربية.' };
        msg.textContent = why[ev.error] || 'لم أسمعك جيداً، أعد المحاولة.';
        L.fails++; if (L.fails >= 2) { actions.replaceChildren(...fb()); }
      };
      rec.onend = async () => { rec = null; mic.classList.remove('live'); await stopRec(); evaluate(); };
      mic.classList.add('live'); msg.textContent = '';
      try { rec.start(); } catch (e) { rec = null; mic.classList.remove('live'); }
    }

    // جهاز بلا تعرّف على الكلام: نسجّل تسميعه ليسمعه أبوه ويؤكد
    async function toggleRecordOnly() {
      if (!canRec) return;
      if (recorder && recorder.active) { mic.classList.remove('live'); await stopRec(); if (lastBlob) { msg.textContent = 'تم التسجيل. استمع إليه ثم أرسله لأبيك.'; actions.replaceChildren(el('button', { class: 'btn ghost', onclick: () => { stopAudio(); audio = new Audio(URL.createObjectURL(lastBlob)); audio.play().catch(() => {}); } }, 'استمع لتسجيلك'), parentBtn('أرسلتها لأبي (مع التسجيل)')); } else msg.textContent = 'لم يُلتقط صوت. أعد التسجيل.'; return; }
      stopAudio(); actions.replaceChildren(); msg.textContent = 'جارٍ التسجيل… سمّع الآية ثم اضغط لإنهاء التسجيل.';
      await startRec(); if (recorder) mic.classList.add('live'); else msg.textContent = 'لم أستطع فتح الميكروفون. اسمح له من إعدادات المتصفح.';
    }
    async function evaluate() {
      if (!heardAlts.some(Boolean)) { if (!L.srErr) { if (lastBlob) noConc = true; L.fails++; msg.textContent = 'لم أسمع شيئاً. أعد.'; if (L.fails >= 2) actions.replaceChildren(...fb()); } return; }
      const best = heardAlts.map(h => compare(u.c, h)).sort((a, b) => b.score - a.score)[0];
      const pct = Math.round(best.score * 100);
      let hits = best.hit;
      if (hits.length !== words.length) {   // «يا» تُكتب كلمة مستقلة في النص المنظَّف: نضمّها إلى التي بعدها
        const g = []; let carry = [];
        u.c.split(' ').forEach((t, j) => { carry.push(best.hit[j]); if (t !== 'يا') { g.push(carry.every(Boolean)); carry = []; } });
        hits = g;
      }
      if (words.length === hits.length && pg.box.c) { const c = pg.box.c; c.setHidden(() => false); c.setHit(i => hits[i]); c.setMiss(i => !hits[i]); }
      const ok = best.score >= S.threshold;
      if (ok || (kind === 'review' && L.fails >= 1)) {
        msg.textContent = ok ? `ما شاء الله! ${pct}%` : `${pct}% — سنراجعها غداً بإذن الله`;
        await finish('voice', best.score);
      } else {
        L.fails++;
        msg.textContent = `${pct}% — أعد المحاولة (تحتاج ${Math.round(S.threshold * 100)}%)`;
        actions.replaceChildren(playBtn('🔊 استمع ثم أعد'));
        if (L.fails >= 2) actions.replaceChildren(playBtn('🔊 استمع ثم أعد'), ...fb());
      }
    }
    // بعد محاولتين فاشلتين: سجّل تسميعك ليسمعه أبوك (بلا تعرّف)، أو أخبر أباك مباشرة
    function fb() {
      const out = [];
      if (canRec && kind === 'new') out.push(el('button', { class: 'btn ghost', onclick: async () => {
        stopAudio(); noConc = true; actions.replaceChildren(); msg.textContent = 'جارٍ التسجيل… سمّع الآية ثم اضغط «إنهاء التسجيل».';
        await startRec(); if (!recorder) { msg.textContent = 'لم أستطع فتح الميكروفون. اسمح له من إعدادات المتصفح.'; actions.replaceChildren(parentBtn()); return; }
        actions.replaceChildren(el('button', { class: 'btn', onclick: async () => { await stopRec(); if (lastBlob) { msg.textContent = 'تم التسجيل. استمع إليه ثم أرسله لأبيك.'; actions.replaceChildren(el('button', { class: 'btn ghost', onclick: () => { stopAudio(); audio = new Audio(URL.createObjectURL(lastBlob)); audio.play().catch(() => {}); } }, 'استمع لتسجيلك'), parentBtn('أرسلتها لأبي (مع التسجيل)')); } else { msg.textContent = 'لم يُلتقط صوت.'; actions.replaceChildren(...fb()); } } }, 'إنهاء التسجيل'));
      } }, 'سجّل تسميعك لأبيك'));
      out.push(parentBtn()); return out;
    }
    function parentBtn(txt) {
      return el('button', { class: 'btn ghost', onclick: () => { if (kind === 'new' && !confirm('هل أبوك بجانبك الآن ليسمع تسميعك؟ لن تُحسب الآية إلا بعد أن يؤكد أنه سمعها.')) return; finish(kind === 'new' ? 'pending' : 'self', 0); } },
        txt || (kind === 'new' ? 'سمّعتها لأبي (ينتظر تأكيده)' : kind === 'practice' ? 'أنهيت التدريب' : 'راجعتها بدون ميكروفون'));
    }
    async function finish(method, score) {
      mic.disabled = true;
      if (kind === 'practice') { done('practice'); return; }   // تدريب: لا يُسجَّل شيء
      let recId = null;
      if (lastBlob) {   // نسخة محلية 14 يوماً، ونسخة مؤقتة للخادم فقط إن كان التسميع ينتظر تأكيد الأب
        try { await Rec.save({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), kidId: TOKEN, label: `${u.name} ${u.i}`, date: new Date().toISOString().slice(0, 10), kind, t: Date.now(), mime: lastBlob.type }, lastBlob); } catch (_) {}
        if (method === 'pending' && lastBlob.size <= 2e6) {
          try { const r = await fetch(`/api/v2/kids/${TOKEN}/relay`, { method: 'POST', headers: { 'Content-Type': lastBlob.type || 'audio/webm', 'X-Session': (() => { try { return localStorage.getItem('ayah_session') || ''; } catch (_) { return ''; } })() }, body: lastBlob }); if (r.ok) recId = (await r.json()).rid; } catch (_) {}
        }
      }
      try { S = await api(resultApi(), 'POST', { key: u.key, kind, method, score, ...(recId ? { rec: recId } : {}), extra: !!extra, secs: Math.min(1800, Math.round((Date.now() - T0) / 1000)), diag: { sr: !!SR, err: L.srErr || '', fails: L.fails, rec: lastBlob ? 'ok' : (recErr || (canRec ? 'none' : 'off')), native: !!window.NATIVE, ua: navigator.userAgent.slice(0, 80) } }); }
      catch (e) { msg.textContent = 'تعذّر الحفظ: ' + e.message; mic.disabled = false; return; }
      done(method);
    }
    function done(method) {
      show(el('div', { class: 'hero' },
        el('div', { class: 'big-num' }, '🌟'),
        el('h1', {}, method === 'pending' ? 'سُجّلت، وينتظر أبوك' : 'ما شاء الله!'),
        el('div', {}, kind === 'new' ? `حفظتَ ${u.name} ${u.i}` : kind === 'practice' ? `ثبّتَّ ${u.name} ${u.i}` : `راجعتَ ${u.name} ${u.i}`),
        el('div', { class: 'mute' }, `أيامك المتواصلة: ${S.streak}`)),
        el('button', { class: 'btn gold', onclick: home }, 'رجوع'));
    }

    const dockNodes = [msg];
    if (SR || canRec) dockNodes.push(mic); if (SR) {} else if (canRec) dockNodes.push(el('div', { class: 'note' }, 'هذا الجهاز لا يستطيع سماع تسميعك، لكنه يسجّله ليسمعه أبوك ويؤكد. اضغط الميكروفون وسمّع الآية.'), actions); else dockNodes.push(el('div', { class: 'note' }, 'هذا الجهاز أو المتصفح لا يدعم سماع التسميع. افتح ثبات من Chrome على أندرويد أو من تطبيق ثبات، أو سمّع لأبيك.'), parentBtn());
    if (!dockNodes.includes(actions)) dockNodes.push(actions);
    setDock(topCard(''), ...dockNodes);
    PEND.zoom.classList.add('slim');
    show(pg.host);
  }

  run();
}
load();
</script>
